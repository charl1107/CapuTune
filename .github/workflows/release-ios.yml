name: iOS Build

# Tag-driven releases, following the Android workflow. Pushing a tag
# vX.Y.Z (or dispatching this workflow with one) builds an unsigned iOS
# app archive and attaches it as an .ipa to the CapuTune vX.Y.Z GitHub
# Release. iOS compilation requires macOS/Xcode, so this runs on a macOS
# runner.
#
# The .ipa is UNSIGNED: there is no Apple Developer account certificate in
# CI. Sideload it with Sideloadly / AltStore / Xcode, which re-sign it with
# a personal (free) Apple ID — the standard route for self-distributed apps.
#
# The Android workflow is still the release owner (it publishes the
# release and its APK first). Both workflows read the version from the
# tag and stamp the same build number into pubspec.yaml, so the IPA
# matches the APK without any cross-run coordination. This job only waits
# for the release to exist right before attaching its assets. No signing
# secrets required.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v2.0.0)
        required: true
        type: string

concurrency:
  group: ios-build
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version from the tag
        id: version
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' is not a release tag (expected vX.Y.Z)."
            exit 1
          fi
          version=${tag#v}
          current=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          pubspec_version=${current%%+*}
          build=${current##*+}
          case "$build" in
            ''|*[!0-9]*) build=0 ;;
          esac
          lowest=$(printf '%s\n%s\n' "$version" "$pubspec_version" | sort -V | head -n 1)
          if [[ "$lowest" != "$pubspec_version" ]]; then
            echo "Tag version $version is lower than pubspec version $pubspec_version; refusing to downgrade."
            exit 1
          fi
          build=$((build + 1))
          # BSD sed (macOS) needs an explicit empty backup suffix for -i.
          sed -i '' -e "s/^version:.*/version: $version+$build/" pubspec.yaml
          {
            echo "version=$version"
            echo "build=$build"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build iOS app (unsigned, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .ipa
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          app=$(find build/ios/iphoneos -name "Runner.app" -maxdepth 1)
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "caputune-${RELEASE_TAG}-ios-unsigned.ipa" Payload
          rm -rf Payload
          shasum -a 256 "caputune-${RELEASE_TAG}-ios-unsigned.ipa" \
            > "caputune-${RELEASE_TAG}-ios-unsigned.ipa.sha256"

      - name: Verify IPA version matches the release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          plist="build/ios/iphoneos/Runner.app/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          echo "Built version: $version ($build), release tag: $RELEASE_TAG"
          if [[ "$version" != "$RELEASE_VERSION" || "$build" != "$BUILD_NUMBER" ]]; then
            echo "ERROR: built version $version ($build) does not match release $RELEASE_TAG"
            exit 1
          fi
          unzip -l "caputune-${RELEASE_TAG}-ios-unsigned.ipa" \
            | grep -q 'Payload/Runner.app/Info.plist' \
            || { echo "ERROR: IPA is missing Payload/Runner.app/Info.plist"; exit 1; }
          unzip -p "caputune-${RELEASE_TAG}-ios-unsigned.ipa" \
            'Payload/Runner.app/Info.plist' > ipa-info.plist
          cmp -s ipa-info.plist "$plist" \
            || { echo "ERROR: packaged Info.plist differs from the built app"; exit 1; }
          echo "Packaged Info.plist matches the built app ($version)"

      - name: Attach .ipa to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # The Android workflow is the release owner: wait for it to
          # publish the CapuTune ${RELEASE_TAG} release (it builds and tests
          # first, so this can take a while), then upload the iOS assets.
          for i in $(seq 1 80); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              break
            fi
            echo "Release ${RELEASE_TAG} not published yet (attempt $i/80)"; sleep 30
          done
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || { echo "Release ${RELEASE_TAG} never appeared"; exit 1; }
          # Retry a few times in case the release was created milliseconds ago.
          for i in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" \
              "caputune-${RELEASE_TAG}-ios-unsigned.ipa" \
              "caputune-${RELEASE_TAG}-ios-unsigned.ipa.sha256" \
              --clobber; then
              echo "Attached iOS assets to ${RELEASE_TAG}"
              exit 0
            fi
            echo "Upload failed (attempt $i)"; sleep 20
          done
          echo "Could not attach iOS assets"; exit 1
